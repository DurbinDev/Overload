{
  "name": "Build APK",
  "on": { "push": { "branches": ["main", "master"] }, "workflow_dispatch": {} },
  "permissions": { "contents": "write" },
  "concurrency": { "group": "build-apk", "cancel-in-progress": true },
  "jobs": { "build": { "runs-on": "ubuntu-latest", "timeout-minutes": 30, "steps": [
    {"uses": "actions/checkout@v5"},
    {"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": "17"}},
    {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
    {"name": "Build debug APK", "timeout-minutes": 20, "run": "if [ -z \"$(find . -name settings.gradle.kts -not -path './.git/*')\" ]; then find . -name '*.zip' -not -path './.git/*' -exec unzip -o -q {} -d unzipped \\; ; fi; P=\"$(find . -name settings.gradle.kts -not -path './.git/*' -not -path '*/__MACOSX/*' | head -1)\"; if [ -z \"$P\" ]; then echo 'No project found. Files in the repo:'; find . -not -path './.git*' | head -80; exit 1; fi; cd \"$(dirname \"$P\")\" && echo \"Building in $PWD\" && gradle assembleDebug --stacktrace -Pkotlin.compiler.execution.strategy=in-process \"-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8\""},
    {"name": "Name the APK", "run": "cp \"$(find . -name app-debug.apk | head -1)\" Overload-${{ github.run_number }}.apk"},
    {"uses": "actions/upload-artifact@v4", "with": {"name": "Overload-apk", "path": "Overload-*.apk"}},
    {"name": "Publish release", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "name": "Overload build ${{ github.run_number }}", "files": "Overload-${{ github.run_number }}.apk", "make_latest": "true"}}
  ] } }
}
